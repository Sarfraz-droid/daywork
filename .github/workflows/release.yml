name: Publish Mac release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: ./scripts/package-release.sh
      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/Daymark-macOS-arm64.zip docs/downloads/SHA256SUMS.txt --verify-tag --title "Daymark $GITHUB_REF_NAME" --generate-notes
